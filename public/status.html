<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
(function(){var t=localStorage.getItem('ht_theme')||'light';document.documentElement.setAttribute('data-theme',t)})();
</script>
<link id="pageFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%231d1d1f'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-family='Arial,sans-serif' font-weight='700' fill='white'%3E%E5%B9%BB%3C/text%3E%3C/svg%3E">
<title>系统状态 - 幻终の导航</title>
<style>
:root{--bg:#f5f5f7;--bg-grad:#f5f5f7;--card-bg:#fff;--card-border:#e5e5ea;--text:#1d1d1f;--text-2:#6e6e73;--accent:#007aff;--accent-soft:rgba(0,122,255,.12);--shadow:0 8px 24px -8px rgba(0,0,0,.08),0 4px 8px -4px rgba(0,0,0,.05);--input-bg:#fff;--chip-bg:#f2f2f7;--ok:#34c759;--warn:#ff9f0a;--danger:#ff3b30}
[data-theme="dark"]{--bg:#000;--bg-grad:#000;--card-bg:#1c1c1e;--card-border:#3a3a3c;--text:#f5f5f7;--text-2:#8e8e93;--accent:#0a84ff;--accent-soft:rgba(10,132,255,.18);--shadow:0 8px 24px -8px rgba(0,0,0,.5),0 4px 8px -4px rgba(0,0,0,.4);--input-bg:#1c1c1e;--chip-bg:#1c1c1e}
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{font-family:"DM Sans","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg-grad) fixed;color:var(--text);min-height:100vh;transition:background .3s,color .3s}.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px}.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}.brand .logo{width:40px;height:40px;border-radius:18px;background:var(--brand-solid,#1d1d1f);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);overflow:hidden;flex:0 0 40px}.brand .logo img{width:100%;height:100%;display:block;object-fit:contain;background:var(--card-bg)}.brand h1{font-size:22px;letter-spacing:1px}.brand small{display:block;color:var(--text-2);font-size:11px;font-weight:400;letter-spacing:0;margin-top:2px}.actions{display:flex;gap:10px}.icon-btn,.btn{border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}.icon-btn{width:40px;height:40px;border-radius:18px;font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none}.icon-btn:hover,.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}.hero{text-align:center;margin:28px 0 34px}.hero .eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:1.6px;margin-bottom:12px}.hero h2{font-size:34px;letter-spacing:1px;margin-bottom:10px}.hero p{color:var(--text-2);font-size:14px}.hero .updated{font-size:12px;margin-top:10px;color:var(--text-2)}.status-pill{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:9px 15px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,199,89,.12)}.status-dot.degraded{background:var(--warn);box-shadow:0 0 0 4px rgba(255,159,10,.13)}.status-dot.outage{background:var(--danger);box-shadow:0 0 0 4px rgba(255,59,48,.12)}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;box-shadow:var(--shadow);padding:22px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel h3{font-size:16px}.panel-head .muted{font-size:12px;color:var(--text-2)}.service{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--card-border)}.service:last-child{border-bottom:0;padding-bottom:0}.service:first-of-type{padding-top:0}.service-main{flex:1;min-width:0}.service-name{font-size:14px;font-weight:650}.service-desc{font-size:12px;color:var(--text-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.service-status{font-size:12px;color:var(--ok);white-space:nowrap}.service-status.degraded{color:var(--warn)}.service-status.outage{color:var(--danger)}.service-latency{font-size:12px;color:var(--text-2);min-width:50px;text-align:right}.dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--ok)}.dot.degraded{background:var(--warn)}.dot.outage{background:var(--danger)}.monitor-tag{font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 7px;margin-left:5px}.metric{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--card-border);font-size:13px}.metric:last-child{border-bottom:0;padding-bottom:0}.metric span{color:var(--text-2)}.metric strong{font-size:14px}.timeline{display:flex;gap:3px;height:28px;align-items:stretch}.bar{flex:1;border-radius:4px;background:var(--ok);opacity:.84;cursor:help;transition:opacity .15s,transform .15s}.bar:hover{opacity:1;transform:scaleY(1.12)}.bar.degraded{background:var(--warn)}.bar.outage{background:var(--danger)}.timeline-label{display:flex;justify-content:space-between;color:var(--text-2);font-size:11px;margin-top:9px}.empty{color:var(--text-2);font-size:13px;padding:12px 0}.manage{display:none!important;margin-top:16px}.manage summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;user-select:none}.manage-body{margin-top:18px}.form-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:9px}.field{width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text);outline:none;font:inherit;font-size:13px}.field:focus{border-color:var(--accent)}.field.full{grid-column:1/-1}.btn{border-radius:14px;padding:10px 14px;font-size:13px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.monitor-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--card-border);font-size:12px}.monitor-row:last-child{border-bottom:0}.monitor-row .url{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}.monitor-row button{padding:4px 8px;border-radius:10px;font-size:11px}.note{font-size:12px;color:var(--text-2);line-height:1.6}.footer{text-align:center;color:var(--text-2);font-size:12px;margin-top:34px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);display:none;z-index:5}@media(max-width:720px){.wrap{padding:12px 14px 40px}header{padding:14px 4px}.brand h1{font-size:18px}.hero{margin:22px 0 28px}.hero h2{font-size:28px}.grid{grid-template-columns:1fr}.panel{padding:18px}.service-latency{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.nav-hide{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="/"><span class="logo" id="logoMark">幻</span><span><h1 id="siteName">幻终の导航</h1><small>运行状态中心</small></span></a><div class="actions"><a class="icon-btn nav-hide" href="/" title="返回首页">⌂</a><button class="icon-btn" id="themeBtn" title="切换主题">◐</button><button class="icon-btn" id="refreshBtn" title="刷新状态">↻</button></div></header>
<main><section class="hero"><div class="eyebrow">SYSTEM STATUS</div><h2 id="statusTitle">正在检查系统状态</h2><p id="statusSummary">正在获取最新运行状态，请稍候</p><div class="status-pill"><i class="status-dot" id="statusDot"></i><span id="statusPill">检查中</span></div><div class="updated" id="updatedAt"></div></section>
<div class="grid"><section class="panel"><div class="panel-head"><h3>服务组件</h3><span class="muted" id="componentCount">—</span></div><div id="services"><div class="empty">正在加载服务状态…</div></div><div class="manage" id="manageBox" style="display:none"><details><summary>管理自定义网站监控</summary><div class="manage-body"><p class="note">添加后系统会定时检测网站是否返回 2xx/3xx。异常时显示红色告警，不会显示正常的 √ 符号。</p><form id="monitorForm"><div class="form-grid"><input class="field" id="monitorName" maxlength="50" placeholder="网站名称，如：官网" required><input class="field" id="monitorUrl" type="url" placeholder="https://example.com" required><input class="field full" id="monitorDesc" maxlength="120" placeholder="描述（可选）"><div class="form-actions field full" style="border:0;background:transparent;padding:0"><button class="btn primary" type="submit">添加网站监控</button></div></div></form><div id="monitorList" style="margin-top:12px"></div></div></details></div></section>
<aside><section class="panel"><div class="panel-head"><h3>系统概览</h3><span class="muted">实时</span></div><div class="metric"><span>整体状态</span><strong id="overall">检查中</strong></div><div class="metric"><span>服务运行时间</span><strong id="uptime">—</strong></div><div class="metric"><span>最近检查</span><strong id="checked">—</strong></div><div class="metric"><span>正常组件</span><strong id="healthy">—</strong></div></section><section class="panel" style="margin-top:16px"><div class="panel-head"><h3>过去 24 小时</h3><span class="muted">可用性</span></div><div class="timeline" id="timeline"></div><div class="timeline-label"><span>24 小时前</span><span>现在</span></div><div class="empty" id="incidentText">暂无服务中断事件</div></section></aside></div></main><footer class="footer">状态数据由 <span id="footerName">幻终の导航</span> 实时生成</footer></div><div class="toast" id="toast"></div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)}, theme=localStorage.getItem('ht_theme')||'light', isManager=false;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmtDate(iso){if(!iso)return '—';var d=new Date(iso);return isNaN(d)?'—':d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
  function fmtUptime(sec){sec=Number(sec)||0;if(sec<60)return sec+' 秒';if(sec<3600)return Math.floor(sec/60)+' 分钟';if(sec<86400)return Math.floor(sec/3600)+' 小时 '+Math.floor(sec%3600/60)+' 分钟';return Math.floor(sec/86400)+' 天 '+Math.floor(sec%86400/3600)+' 小时'}
  function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(function(){$('toast').style.display='none'},2600)}
  function applyTheme(){document.documentElement.setAttribute('data-theme',theme);$('themeBtn').textContent=theme==='dark'?'☼':'◐'}
  function resetStatusLogo(){var el=$('logoMark');if(!el)return;el.replaceChildren(document.createTextNode('幻'));el.style.background='';delete el.dataset.logoSrc;}
  function applyStatusLogo(url){var el=$('logoMark');if(!el)return;resetStatusLogo();if(!url)return;var img=new Image();img.alt='';img.onload=function(){if(el.dataset.logoSrc!==url)return;el.replaceChildren(img);img.style.width='100%';img.style.height='100%';img.style.objectFit='contain';img.style.display='block';};img.onerror=function(){if(el.dataset.logoSrc===url)resetStatusLogo();};el.dataset.logoSrc=url;img.src=url;}
  function applyFavicon(url){var link=$('pageFavicon');if(url&&(/^\/uploads\/[\w.-]+$/.test(url)||/^https:\/\//i.test(url))){link.href=url;link.type='image/png';}else{link.href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="20" fill="%231d1d1f"/%3E%3Ctext x="32" y="43" text-anchor="middle" font-size="34" font-family="Arial,sans-serif" font-weight="700" fill="white"%3E%E5%B9%BB%3C/text%3E%3C/svg%3E';link.type='image/svg+xml';}}
  function stateText(s){return s==='operational'?'运行正常':s==='pending'?'等待检测':s==='disabled'?'已停用':'发生异常'}
  function serviceHtml(c,isMonitor){var s=c.status||'pending', bad=s!=='operational', label=isMonitor?'网站监控':'系统服务';return '<div class="service"><i class="dot '+(s==='outage'?'outage':s==='degraded'?'degraded':'')+'"></i><div class="service-main"><div class="service-name">'+esc(c.name)+(isMonitor?'<span class="monitor-tag">'+label+'</span>':'')+'</div><div class="service-desc">'+esc(c.description||c.error||'暂无描述')+(c.statusCode?' · HTTP '+esc(c.statusCode):'')+(c.error?' · '+esc(c.error):'')+'</div></div><span class="service-status '+(s==='outage'?'outage':s==='degraded'?'degraded':'')+'">'+stateText(s)+'</span><span class="service-latency">'+(c.latency!=null?esc(c.latency)+' ms':esc(c.uptime||'—'))+'</span></div>'}
  function render(d){var all=(d.components||[]).concat(d.monitors||[]), bad=d.status!=='operational', outage=all.some(function(x){return x.status==='outage'});$('siteName').textContent=d.name||'幻终の导航';$('footerName').textContent=d.name||'幻终の导航';document.title='系统状态 - '+(d.name||'幻终の导航');$('statusTitle').textContent=outage?'部分服务发生异常':(d.statusLabel||'所有系统正常运行');$('statusSummary').textContent=outage?'检测到异常网站或服务，请查看下方告警信息':bad?'部分功能当前受限，请查看下方状态':'所有服务组件均运行正常';$('statusPill').textContent=outage?'发生异常':(bad?'部分受限':'运行正常');$('statusDot').className='status-dot '+(outage?'outage':bad?'degraded':'');$('updatedAt').textContent='最后检查：'+fmtDate(d.checkedAt);$('overall').textContent=outage?'发生异常':bad?'部分受限':'运行正常';$('overall').style.color=outage?'var(--danger)':bad?'var(--warn)':'var(--ok)';$('uptime').textContent=fmtUptime(d.uptimeSeconds);$('checked').textContent=fmtDate(d.checkedAt).replace(/^\d{4}\/\d{1,2}\/\d{1,2} /,'');$('healthy').textContent=all.filter(function(x){return x.status==='operational'}).length+' / '+all.length;$('componentCount').textContent=all.length+' 个组件';var box=$('services');box.innerHTML=all.length?all.map(function(c){return serviceHtml(c,(d.monitors||[]).some(function(m){return m.id===c.id}))}).join(''):'<div class="empty">暂无状态组件</div>';var timeline=$('timeline');timeline.innerHTML='';for(var i=0;i<48;i++)timeline.insertAdjacentHTML('beforeend','<i class="bar '+(outage?'outage':'')+'" title="'+(outage?'存在异常':'正常运行')+'"></i>')}
  function load(){ $('refreshBtn').textContent='…';fetch('/api/status',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('status');return r.json()}).then(render).catch(function(){$('statusTitle').textContent='状态暂时不可用';$('statusSummary').textContent='无法获取服务状态，请稍后刷新重试';$('statusPill').textContent='状态未知';$('statusDot').className='status-dot degraded';$('overall').textContent='未知';$('overall').style.color='var(--warn)'}).finally(function(){$('refreshBtn').textContent='↻'})}
  function loadMonitors(){if(!isManager)return;fetch('/api/admin/status/monitors').then(function(r){return r.json()}).then(function(d){var box=$('monitorList');box.innerHTML='';(d.monitors||[]).forEach(function(m){box.insertAdjacentHTML('beforeend','<div class="monitor-row"><b>'+esc(m.name)+'</b><span class="url">'+esc(m.url)+'</span><button class="btn" data-check="'+esc(m.id)+'">检测</button><button class="btn danger" data-delete="'+esc(m.id)+'">删除</button></div>')});if(!d.monitors||!d.monitors.length)box.innerHTML='<div class="empty">还没有自定义网站监控</div>'}).catch(function(){})}
  $('monitorForm').addEventListener('submit',function(e){e.preventDefault();fetch('/api/admin/status/monitors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('monitorName').value.trim(),url:$('monitorUrl').value.trim(),description:$('monitorDesc').value.trim()})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||'添加失败');return d})}).then(function(){toast('网站监控已添加');$('monitorForm').reset();loadMonitors();load()}).catch(function(e){toast(e.message)})});
  $('monitorList').addEventListener('click',function(e){var b=e.target;if(b.dataset.check){b.disabled=true;fetch('/api/admin/status/monitors/'+encodeURIComponent(b.dataset.check)+'/check',{method:'POST'}).then(function(){toast('检测完成');loadMonitors();load()}).catch(function(){toast('检测失败')}).finally(function(){b.disabled=false})}if(b.dataset.delete&&confirm('确定删除这个网站监控吗？'))fetch('/api/admin/status/monitors/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'}).then(function(){toast('监控已删除');loadMonitors();load()})});
  $('themeBtn').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';localStorage.setItem('ht_theme',theme);applyTheme()});$('refreshBtn').addEventListener('click',load);applyTheme();fetch('/api/auth/info').then(function(r){return r.json()}).then(function(d){if(d.siteName){$('siteName').textContent=d.siteName;$('footerName').textContent=d.siteName;document.title='系统状态 - '+d.siteName}applyStatusLogo(d.logo||'');applyFavicon(d.logo||'');if(d.accentColor&&/^#[0-9a-fA-F]{6}$/.test(d.accentColor)){document.documentElement.style.setProperty('--accent',d.accentColor);document.documentElement.style.setProperty('--accent-soft',d.accentColor+'22')}}).catch(function(){});fetch('/api/auth/me').then(function(r){if(!r.ok)throw Error('no');return r.json()}).then(function(d){isManager=d.user&&(d.user.role==='owner'||d.user.role==='admin');if(isManager){$('manageBox').style.display='block';loadMonitors()}}).catch(function(){});load();setInterval(load,60000);
})();
</script>
</body>
</html>
